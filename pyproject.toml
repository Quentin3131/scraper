[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Local-first, evidence-based entry-level software engineering job market analysis"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dashboard = ["streamlit>=1.38", "plotly>=5.24", "pandas>=2.2"]

[project.scripts]
job-market = "job_market.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["job_market"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
